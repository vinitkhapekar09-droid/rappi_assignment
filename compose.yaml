services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rappi
      POSTGRES_PASSWORD: rappi
      POSTGRES_DB: rappi
    ports:
      - "127.0.0.1:${RAPPI_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rappi -d rappi"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      RAPPI_DATABASE_URL: postgresql+psycopg://rappi:rappi@db:5432/rappi?connect_timeout=10
      RAPPI_MOCK_DATABASE_PATH: /data/mock-orders.sqlite3
      RAPPI_CORS_ORIGINS: '${RAPPI_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai_compatible}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-openai/gpt-oss-120b}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-30}
      AGENT_OFFLINE: ${AGENT_OFFLINE:-false}
      LANGSMITH_TRACING: "false"
    ports:
      - "127.0.0.1:${RAPPI_API_PORT:-8000}:8000"
    volumes:
      - mock_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${RAPPI_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  mock_data:
