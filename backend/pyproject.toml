[project]
name = "rappi-purchasing-agent-backend"
version = "0.1.0"
description = "FastAPI backend and purchasing domain for the Rappi AI Purchasing Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "psycopg[binary]==3.2.3",
    "langgraph==0.6.11",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that require a PostgreSQL database",
]
